<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0604">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Jarvis</title>
<style>
:root{--bg:#0b0604;--panel:#160b07;--line:#3a1d12;--red:#ff6b57;--gold:#ffb347;--dim:#8a6a55;--txt:#f3e6dc}
@media (prefers-color-scheme:light){:root{--bg:#0b0604}} /* Jarvis is always dark */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 "Bahnschrift","Segoe UI",system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto}
header{padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.orb{width:34px;height:34px;border-radius:50%;border:2px solid var(--red);box-shadow:0 0 14px var(--red),inset 0 0 10px var(--gold);flex:none}
.orb.work{animation:spin 1.2s linear infinite;border-top-color:var(--gold)}@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:13px;letter-spacing:4px;color:var(--gold);margin:0;font-weight:600}
#state{font-size:12px;color:var(--dim)}#state.ok::before{content:"● ";color:#5fd38a}#state.off::before{content:"● ";color:var(--red)}
header button{margin-left:auto}
#log{flex:1;overflow-y:auto;padding:12px 16px;-webkit-overflow-scrolling:touch}
.m{margin:10px 0;padding-left:10px;border-left:3px solid var(--red);word-wrap:break-word;white-space:pre-wrap}
.m.u{border-color:#5a2a1c}.who{font-size:11px;letter-spacing:3px;color:var(--gold)}.u .who{color:#b98e68}
.ts{font-size:10px;color:var(--dim);margin-left:8px;letter-spacing:0}
.files{display:flex;flex-direction:column;gap:8px;margin-top:8px;white-space:normal}
.f{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.f b{display:block;font-weight:600;word-break:break-all}.f small{color:var(--dim)}
.f .go{margin-left:auto;display:flex;gap:6px;flex:none}
button{background:transparent;color:var(--gold);border:1px solid var(--red);border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;letter-spacing:1px}
button:active{background:#2a120b}button[disabled]{opacity:.4}
form{display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--line);background:var(--bg)}
input[type=text]{flex:1;min-width:0;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:22px;padding:11px 16px;font:inherit;outline:none}
input[type=text]:focus{border-color:var(--red)}
#mic.on{background:var(--red);color:#000}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;z-index:5}
.sheet.show{display:flex}.sheet .bar{display:flex;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;align-items:center}
.sheet .bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--gold)}
.sheet .body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:8px}
.sheet img{max-width:100%;max-height:100%}.sheet iframe{width:100%;height:100%;border:0;background:#fff}
#welcome{padding:40px 24px;text-align:center}#welcome p{color:var(--dim)}
.hint{color:var(--dim);font-size:12px;text-align:center;margin:6px 0}
</style></head>
<body><div id="app">
<header><div class="orb" id="orb"></div><div><h1>JARVIS</h1><div id="state" class="off">connecting…</div></div>
<button id="more" aria-label="menu">⋯</button></header>
<div id="log"></div>
<form id="form" autocomplete="off">
<button type="button" id="mic" title="Speak" aria-label="Speak">🎤</button>
<input type="text" id="msg" placeholder="Ask Jarvis…  e.g. latest invoice dikhao" enterkeyhint="send" autocapitalize="none">
<button id="send">SEND</button></form>
<div class="sheet" id="sheet"><div class="bar"><span id="stitle"></span><button id="sshare">SHARE</button><button id="ssave">SAVE</button><button id="sclose">CLOSE</button></div><div class="body" id="sbody"></div></div>
</div>
<script src="app.js"></script></body></html>
